  type: cap-atom
  url: https://cap-alerts.s3.amazonaws.com/official-public/rss.xml
  intervalSec: 300
  tier: C
  license: public-domain
  lang: en
  enabled: false

- key: wmo-swic
  type: wmo-swic-directory
  url: https://severeweather.wmo.int/json/sources.json
  intervalSec: 300
  tier: C
  license: public-domain
  lang: en
  enabled: false

- key: ifrc-alert-hub
  type: ifrc-graphql
  url: https://alerthub-api.ifrc.org/graphql/
  intervalSec: 300
  tier: C
  license: terms-of-use
  lang: en
  enabled: false

- key: gdacs
  type: gdacs-rss
  url: https://www.gdacs.org/xml/rss.xml
  intervalSec: 300
  tier: C
  license: public-domain
  lang: en
  enabled: false

- key: reliefweb
  type: reliefweb-json
  url: https://api.reliefweb.int/v2/reports
  intervalSec: 900
  tier: C
  license: terms-of-use
  lang: en
  enabled: false

- key: nasa-eonet
  type: eonet-json
  url: https://eonet.gsfc.nasa.gov/api/v3/events
  intervalSec: 600
  tier: C
  license: public-domain
  lang: en
  enabled: false

- key: copernicus-ems
  type: copernicus-ems-json
  url: https://mapping.emergency.copernicus.eu/activations/api/activations/?closed=false
  intervalSec: 900
  tier: C
  license: terms-of-use
  lang: en
  enabled: false

- key: usgs-eq
  type: usgs-geojson
  url: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/significant_hour.geojson
  intervalSec: 60
  tier: B
  license: public-domain
  enabled: false
